<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anah Master Plan Web GIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
}
#map{width:100%;height:100%;}

.title{
  position:absolute;
  top:14px;
  left:55px;
  z-index:1000;
  background:rgba(15,23,42,.82);
  color:#fff;
  padding:10px 16px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.title b{font-size:17px;}
.title span{display:block;font-size:12px;color:#cbd5e1;}

.panel{
  position:absolute;
  top:14px;
  right:14px;
  z-index:1000;
  width:285px;
  max-height:88vh;
  overflow:auto;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
  padding:14px;
}
.panel h2{
  margin:0 0 4px;
  font-size:18px;
  color:#0f172a;
}
.panel small{color:#64748b;}

.layer{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  font-size:14px;
  white-space:nowrap;
}
.swatch{
  width:16px;
  height:16px;
  border-radius:4px;
  border:1px solid #555;
  flex:0 0 16px;
}

.coords{
  position:absolute;
  bottom:12px;
  left:12px;
  z-index:1000;
  background:rgba(15,23,42,.86);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
}

.search-panel{
  position:absolute;
  top:82px;
  left:55px;
  z-index:1000;
  width:250px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  border-radius:14px;
  padding:8px;
  box-shadow:0 6px 22px rgba(0,0,0,.22);
}
.search-panel input{
  width:100%;
  box-sizing:border-box;
  border:1px solid #cbd5e1;
  border-radius:8px;
  padding:7px;
  font-size:12px;
  margin-bottom:6px;
}
.search-panel button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:7px;
  background:#0f172a;
  color:white;
  font-size:12px;
  cursor:pointer;
}
.coord-row{
  display:grid;
  grid-template-columns:1fr 1fr 56px;
  gap:5px;
  margin-top:6px;
}
.coord-row input{margin-bottom:0;}
.coord-row button{padding:7px 4px;}

.measure-label{
  background:rgba(15,23,42,.82);
  color:white;
  padding:3px 6px;
  border-radius:7px;
  font-size:10px;
  line-height:1.25;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  text-align:center;
  pointer-events:none;
}

@media(max-width:700px){

  .title{
    left:50%;
    transform:translateX(-50%);
    top:12px;
    max-width:230px;
    padding:7px 12px;
    border-radius:12px;
    text-align:center;
  }
  .title b{font-size:14px;}
  .title span{font-size:10px;}

  .search-panel{
    top:58px;
    left:78px;
    width:190px;
    padding:6px;
  }
  .search-panel input{
    padding:5px;
    font-size:10px;
    margin-bottom:4px;
  }
  .search-panel button{
    padding:5px;
    font-size:10px;
  }
  .coord-row{
    grid-template-columns:1fr 1fr 44px;
    gap:4px;
  }

  .panel{
    width:calc(100% - 16px);
    left:8px;
    right:8px;
    top:auto;
    bottom:8px;
    max-height:18vh;
    padding:6px 8px;
    border-radius:14px;
    overflow:auto;
    background:rgba(255,255,255,.94);
  }
  .panel h2{
    font-size:11px;
    margin:0;
    line-height:1.1;
  }
  .panel small{display:none;}

  #layerList{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:2px 6px;
    margin-top:4px;
  }
  .layer{
    margin:0;
    gap:4px;
    font-size:10px;
    line-height:1.15;
    white-space:nowrap;
  }
  .layer input{
    width:11px;
    height:11px;
    margin:0;
  }
  .swatch{
    width:9px;
    height:9px;
    flex:0 0 9px;
    border-radius:2px;
  }

  .coords{
    bottom:132px;
    left:10px;
    font-size:10px;
    padding:5px 7px;
    border-radius:8px;
  }

  .leaflet-top.leaflet-right{
    top:10px !important;
    right:10px !important;
  }
  .leaflet-control-layers{
    margin:0 !important;
  }
  .leaflet-control-layers-toggle{
    width:34px !important;
    height:34px !important;
  }
}
  .coord-label{
  background:rgba(15,23,42,.82);
  color:#fff;
  padding:3px 6px;
  border-radius:7px;
  font-size:10px;
  line-height:1.2;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  text-align:center;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="title">
  <b>Anah Master Plan</b>
  <span>Urban Land Use Web GIS</span>
</div>

<div class="panel">
  <h2>Layers Control</h2>
  <small>Turn layers on / off</small>
  <div id="layerList"></div>
</div>

<div class="coords" id="coords">Lat: -- | Lon: --</div>

<div class="search-panel">
  <input id="plotSearch" type="text" placeholder="Search plot number">
  <button onclick="searchPlot()">Search</button>

  <div class="coord-row">
    <input id="manualLat" type="text" placeholder="Lat">
    <input id="manualLon" type="text" placeholder="Lon">
    <button onclick="addManualMarker()">Add</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
const map = L.map('map', {
  zoomControl:true,
  maxZoom:22
}).setView([34.369, 41.981], 13);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22,
  attribution:'© OpenStreetMap'
});

const esriImagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    maxZoom:22,
    maxNativeZoom:18,
    attribution:'Tiles © Esri'
  }
);

const esriHybrid = L.layerGroup([
  esriImagery,
  L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:22}
  )
]).addTo(map);

L.control.layers({
  "Satellite": esriHybrid,
  "Imagery": esriImagery,
  "OpenStreetMap": osm
}, null, {position:'topright'}).addTo(map);

function normalizeSearchValue(v){
  return String(v ?? "")
    .replace(/[\u200E\u200F\u202A-\u202E]/g, "")
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/,/g, "")
    .trim()
    .replace(/\.0$/, "");
}

function formatPopupValue(key, val){
  const k = String(key).toLowerCase();

  if(
    k.includes("shape_area") ||
    k.includes("area") ||
    k.includes("مساح")
  ){
    const n = Number(val);
    if(!isNaN(n)) return Math.round(n) + " m²";
  }

  if(
    k.includes("shape_leng") ||
    k.includes("length") ||
    k.includes("perimeter") ||
    k.includes("محيط")
  ){
    const n = Number(val);
    if(!isNaN(n)) return Math.round(n) + " m";
  }

  return val;
}

function isIgnoredSearchKey(k){
  const key = normalizeSearchValue(k).toLowerCase();

  return (
    key === "objectid" ||
    key === "fid" ||
    key === "oid" ||
    key === "oid_" ||
    key.includes("shape") ||
    key.includes("area") ||
    key.includes("length") ||
    key.includes("مساح") ||
    key.includes("محيط")
  );
}

const layersConfig = [
  {name:"Master Plan Boundary", file:"master plan boundary.geojson", color:"#ff3b3b", fill:"#ffffff", opacity:0.02, weight:3, checked:true},
  {name:"Residential", file:"Residential.geojson", color:"#9a9a00", fill:"#ffff00", opacity:0.72, weight:0.7, checked:true},
  {name:"Proposed Residential", file:"Proposed_Residential.geojson", color:"#d99000", fill:"#ffd27a", opacity:0.72, weight:1, checked:true},
  {name:"Vertical Residential", file:"Vertical_Residential.geojson", color:"#5e0000", fill:"#8b0000", opacity:0.82, weight:1, checked:true},
  {name:"Commercial", file:"Commercial.geojson", color:"#b10000", fill:"#ff0000", opacity:0.82, weight:1, checked:true},
  {name:"Industrial", file:"Industrial.geojson", color:"#6f00b5", fill:"#a000ff", opacity:0.78, weight:1, checked:true},
  {name:"Public Use", file:"PublicUse.geojson", color:"#6b8ea3", fill:"#c7ddeb", opacity:0.82, weight:1, checked:true},
  {name:"Educational", file:"Educational.geojson", color:"#003d99", fill:"#0057c2", opacity:0.85, weight:1, checked:true},
  {name:"Health", file:"Health.geojson", color:"#b86ca1", fill:"#e5acd1", opacity:0.88, weight:1, checked:true},
  {name:"Green Areas", file:"GreenArea.geojson", color:"#238f00", fill:"#38b000", opacity:0.72, weight:1, checked:true},
  {name:"Religious", file:"Religious.geojson", color:"#c69a2d", fill:"#f2c96d", opacity:0.90, weight:1.5, checked:true},
  {name:"Tourist", file:"Tourist.geojson", color:"#8c6500", fill:"#b8860b", opacity:0.82, weight:1, checked:true},
  {name:"Oil Station", file:"Oil station.geojson", color:"#0077a8", fill:"#00a8e8", opacity:0.90, weight:1, checked:true},
  {name:"Cemetery", file:"cemetery.geojson", color:"#b89952", fill:"#f0c96b", opacity:0.80, weight:1, checked:true},
  {name:"Roads", file:"Roads.geojson", color:"#555555", fill:"#8a8a8a", opacity:0.95, weight:2.2, checked:true}
];

let allFeatureLayers = [];
let searchMarker = null;
let highlightLayer = null;

const loadedLayers = {};
const layerList = document.getElementById("layerList");
const boundsGroup = L.featureGroup();

layersConfig.forEach((cfg, i)=>{
  const id = "layer_" + i;

  const row = document.createElement("div");
  row.className = "layer";
  row.innerHTML = `
    <input type="checkbox" id="${id}" ${cfg.checked ? "checked" : ""}>
    <span class="swatch" style="background:${cfg.fill};border-color:${cfg.color}"></span>
    <label for="${id}">${cfg.name}</label>
  `;
  layerList.appendChild(row);

  fetch("./geojson/" + cfg.file)
    .then(r => {
      if(!r.ok) throw new Error(cfg.file + " not found");
      return r.json();
    })
    .then(data => {
      const layer = L.geoJSON(data, {
        style: function(){
          return {
            color: cfg.color,
            weight: cfg.weight,
            fillColor: cfg.fill,
            fillOpacity: cfg.opacity,
            opacity: 1
          };
        },

        pointToLayer: function(feature, latlng){
          const r = cfg.name === "Religious" ? 10 : 7;

          return L.circleMarker(latlng,{
            radius:r,
            color:cfg.color,
            weight:2.5,
            fillColor:cfg.fill,
            fillOpacity:1
          });
        },

        onEachFeature: function(feature, lyr){
          const props = feature.properties || {};
          let html = `<b>${cfg.name}</b><hr>`;

          Object.keys(props).forEach(k=>{
            let val = props[k];

            if(val !== null && val !== ""){
              val = formatPopupValue(k, val);
              html += `<b>${k}</b>: ${val}<br>`;
            }
          });

          lyr.bindPopup(html);
        }
      });

      loadedLayers[id] = layer;
      allFeatureLayers.push({layer:layer, cfg:cfg});

      if(cfg.checked){
        layer.addTo(map);
      }

      boundsGroup.addLayer(layer);

      document.getElementById(id).addEventListener("change", function(){
        if(this.checked){
          map.addLayer(layer);
          bringImportantLayersToFront();
        }else{
          map.removeLayer(layer);
        }
      });

      if(Object.keys(loadedLayers).length === layersConfig.length){
        map.fitBounds(boundsGroup.getBounds(), {padding:[30,30]});
        bringImportantLayersToFront();
      }
    })
    .catch(err=>{
      console.warn("Layer load error:", err.message);
    });
});

function bringImportantLayersToFront(){
  layersConfig.forEach((cfg, i)=>{
    const layer = loadedLayers["layer_" + i];
    if(!layer || !map.hasLayer(layer)) return;

    if(
      cfg.name === "Religious" ||
      cfg.name === "Health" ||
      cfg.name === "Educational" ||
      cfg.name === "Commercial" ||
      cfg.name === "Oil Station" ||
      cfg.name === "Roads" ||
      cfg.name === "Master Plan Boundary"
    ){
      layer.bringToFront();
    }
  });
}

map.on("mousemove", e=>{
  document.getElementById("coords").innerHTML =
    "Lat: " + e.latlng.lat.toFixed(6) + " | Lon: " + e.latlng.lng.toFixed(6);
});

map.on("click", e=>{
  L.popup()
    .setLatLng(e.latlng)
    .setContent(
      "<b>Coordinates</b><br>" +
      "Lat: " + e.latlng.lat.toFixed(6) + "<br>" +
      "Lon: " + e.latlng.lng.toFixed(6)
    )
    .openOn(map);
});

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const measureLabelIcon = (text) => L.divIcon({
  className: "measure-label",
  html: text,
  iconSize: null
});

function formatM(v){
  return Math.round(v) + " m";
}

function formatM2(v){
  return Math.round(v) + " m²";
}

function lineLength(latlngs){
  let total = 0;
  for(let i=1;i<latlngs.length;i++){
    total += latlngs[i-1].distanceTo(latlngs[i]);
  }
  return total;
}

function polygonArea(latlngs){
  let area = 0;
  const pts = latlngs.map(p => map.latLngToLayerPoint(p));
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    area += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  }
  return Math.abs(area / 2) * Math.pow(40075016.686 / (256 * Math.pow(2, map.getZoom())), 2);
}

function polygonPerimeter(latlngs){
  let total = lineLength(latlngs);
  total += latlngs[latlngs.length-1].distanceTo(latlngs[0]);
  return total;
}

function centerOf(latlngs){
  let lat = 0, lng = 0;
  latlngs.forEach(p => { lat += p.lat; lng += p.lng; });
  return L.latLng(lat / latlngs.length, lng / lngs.length);
}
</script>

<script>
function centerOf(latlngs){
  let lat = 0, lng = 0;
  latlngs.forEach(p => { lat += p.lat; lng += p.lng; });
  return L.latLng(lat / latlngs.length, lng / latlngs.length);
}

const drawControl = new L.Control.Draw({
  position:'topleft',
  edit:{featureGroup:drawnItems},
  draw:{
    polygon:true,
    polyline:true,
    rectangle:false,
    circle:false,
    circlemarker:false,
    marker:true
  }
});
map.addControl(drawControl);

map.on(L.Draw.Event.CREATED, function(e){
  const layer = e.layer;
  drawnItems.addLayer(layer);

  if(e.layerType === "polyline"){
    const pts = layer.getLatLngs();
    const len = lineLength(pts);
    const mid = pts[Math.floor(pts.length / 2)];

    L.marker(mid,{
      icon:measureLabelIcon(formatM(len))
    }).addTo(drawnItems);
  }

  if(e.layerType === "polygon"){
    const pts = layer.getLatLngs()[0];
    const area = polygonArea(pts);
    const perimeter = polygonPerimeter(pts);
    const center = centerOf(pts);

    L.marker(center,{
      icon:measureLabelIcon(formatM2(area) + "<br>" + formatM(perimeter))
    }).addTo(drawnItems);
  }

  if(e.layerType === "marker"){
  drawnItems.removeLayer(layer);
  const p = layer.getLatLng();
  addEditableCoordinateMarker(p.lat, p.lng);
}
});

L.control.scale({position:'bottomleft'}).addTo(map);

function searchPlot(){
  const q = normalizeSearchValue(document.getElementById("plotSearch").value);
  if(!q) return;

  let found = null;

  allFeatureLayers.forEach(item=>{
    item.layer.eachLayer(lyr=>{
      const props = lyr.feature?.properties || {};

      Object.keys(props).forEach(k=>{
        if(isIgnoredSearchKey(k)) return;

        const val = normalizeSearchValue(props[k]);

        if(val === q){
          found = {layer:lyr, cfg:item.cfg};
        }
      });
    });
  });

  if(!found){
    alert("Plot not found");
    return;
  }

  if(highlightLayer){
    map.removeLayer(highlightLayer);
    highlightLayer = null;
  }

  highlightLayer = L.geoJSON(found.layer.feature,{
    style:{
      color:"#00ffff",
      weight:4,
      fillColor:"#00ffff",
      fillOpacity:0.35
    }
  }).addTo(map);

  if(found.layer.getBounds){
    map.fitBounds(found.layer.getBounds(), {padding:[40,40], maxZoom:20});
  }

  found.layer.openPopup();
}
function addEditableCoordinateMarker(lat, lon){
  const p = L.latLng(lat, lon);

  const marker = L.marker(p, {
    draggable:true
  });

  const label = L.marker(p, {
    interactive:false,
    icon:L.divIcon({
      className:"coord-label",
      html:lat.toFixed(6) + "<br>" + lon.toFixed(6),
      iconSize:null,
      iconAnchor:[35,38]
    })
  });

  const group = L.layerGroup([marker, label]);

  marker.on("drag", function(e){
    const np = e.target.getLatLng();
    label.setLatLng(np);
    label.setIcon(L.divIcon({
      className:"coord-label",
      html:np.lat.toFixed(6) + "<br>" + np.lng.toFixed(6),
      iconSize:null,
      iconAnchor:[35,38]
    }));
  });

  drawnItems.addLayer(group);
  map.setView(p, 18);
}
function addManualMarker(){
  const lat = parseFloat(document.getElementById("manualLat").value);
  const lon = parseFloat(document.getElementById("manualLon").value);

  if(isNaN(lat) || isNaN(lon)){
    alert("Enter valid coordinates");
    return;
  }

  addEditableCoordinateMarker(lat, lon);
}
</script>

</body>
</html>
