<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anah Master Plan Web GIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
}
#map{width:100%;height:100%;}

.panel{
  position:absolute;
  top:14px;
  right:14px;
  z-index:1000;
  width:285px;
  max-height:88vh;
  overflow:auto;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
  padding:14px;
}
.panel h2{
  margin:0 0 4px;
  font-size:18px;
  color:#0f172a;
}
.panel small{color:#64748b;}

.layer{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  font-size:14px;
  white-space:nowrap;
}
.swatch{
  width:16px;
  height:16px;
  border-radius:4px;
  border:1px solid #555;
  flex:0 0 16px;
}
.coords{
  position:absolute;
  bottom:12px;
  left:12px;
  z-index:1000;
  background:rgba(15,23,42,.86);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
}
.title{
  position:absolute;
  top:14px;
  left:55px;
  z-index:1000;
  background:rgba(15,23,42,.82);
  color:#fff;
  padding:10px 16px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.title b{font-size:17px;}
.title span{display:block;font-size:12px;color:#cbd5e1;}

@media(max-width:700px){
  .panel{
    width:210px;
    right:10px;
    left:auto;
    top:auto;
    bottom:56px;
    max-height:32vh;
    padding:9px;
    border-radius:14px;
    font-size:12px;
  }

  .panel h2{
    font-size:14px;
    margin-bottom:2px;
  }

  .panel small{
    font-size:11px;
  }

  .layer{
    margin:5px 0;
    gap:6px;
    font-size:12px;
  }

  .layer input{
    width:13px;
    height:13px;
  }

  .swatch{
    width:12px;
    height:12px;
    flex:0 0 12px;
    border-radius:3px;
  }

  .title{
    left:78px;
    top:12px;
    max-width:210px;
    padding:8px 12px;
  }

  .title b{
    font-size:15px;
  }

  .title span{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="title">
  <b>Anah Master Plan</b>
  <span>Urban Land Use Web GIS</span>
</div>

<div class="panel">
  <h2>Layers Control</h2>
  <small>Turn layers on / off</small>
  <div id="layerList"></div>
</div>

<div class="coords" id="coords">Lat: -- | Lon: --</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
const map = L.map('map', {
  zoomControl:true
}).setView([34.369, 41.981], 13);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22,
  attribution:'© OpenStreetMap'
});

const esriImagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:22, attribution:'Tiles © Esri'}
);

const esriHybrid = L.layerGroup([
  esriImagery,
  L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:22}
  )
]).addTo(map);

L.control.layers({
  "Satellite": esriHybrid,
  "Imagery": esriImagery,
  "OpenStreetMap": osm
}, null, {position:'bottomright'}).addTo(map);

const layersConfig = [
  {name:"Master Plan Boundary", file:"master plan boundary.geojson", color:"#ef4444", fill:"#ffffff", opacity:0.03, weight:3, checked:true},
  {name:"Green Areas", file:"GreenArea.geojson", color:"#16a34a", fill:"#39ff14", opacity:0.65, weight:1, checked:true},
  {name:"Residential", file:"Residential.geojson", color:"#8a8a00", fill:"#fff200", opacity:0.70, weight:0.7, checked:true},
  {name:"Vertical Residential", file:"Vertical_Residential.geojson", color:"#b45309", fill:"#f59e0b", opacity:0.75, weight:1, checked:true},
  {name:"Commercial", file:"Commercial.geojson", color:"#991b1b", fill:"#dc2626", opacity:0.75, weight:1, checked:true},
  {name:"Commercial Line", file:"Commercial_line.geojson", color:"#ef4444", fill:"#ef4444", opacity:0.95, weight:3, checked:true},
  {name:"Industrial", file:"Industrial.geojson", color:"#6b21a8", fill:"#a855f7", opacity:0.70, weight:1, checked:true},
  {name:"Services", file:"Services.geojson", color:"#0284c7", fill:"#bae6fd", opacity:0.75, weight:1, checked:true},
  {name:"Educational", file:"Educational.geojson", color:"#1d4ed8", fill:"#3b82f6", opacity:0.75, weight:1, checked:true},
  {name:"Health", file:"Health.geojson", color:"#be185d", fill:"#ec4899", opacity:0.85, weight:1, checked:true},
  {name:"Religious", file:"Religious.geojson", color:"#facc15", fill:"#facc15", opacity:0.95, weight:2, checked:true},
  {name:"Tourist", file:"Tourist.geojson", color:"#65a30d", fill:"#d9f99d", opacity:0.75, weight:1, checked:true},
  {name:"Oil Station", file:"Oil station.geojson", color:"#0369a1", fill:"#0ea5e9", opacity:0.90, weight:1, checked:true},
  {name:"Garage", file:"Garadge.geojson", color:"#334155", fill:"#94a3b8", opacity:0.85, weight:1, checked:true},
  {name:"Cemetery", file:"cemetery.geojson", color:"#57534e", fill:"#d6d3d1", opacity:0.80, weight:1, checked:true},
  {name:"Roads", file:"Roads.geojson", color:"#111827", fill:"#6b7280", opacity:0.95, weight:2.5, checked:true}
];

const loadedLayers = {};
const layerList = document.getElementById("layerList");
const boundsGroup = L.featureGroup();

layersConfig.forEach((cfg, i)=>{
  const id = "layer_" + i;

  const row = document.createElement("div");
  row.className = "layer";
  row.innerHTML = `
    <input type="checkbox" id="${id}" ${cfg.checked ? "checked" : ""}>
    <span class="swatch" style="background:${cfg.fill};border-color:${cfg.color}"></span>
    <label for="${id}">${cfg.name}</label>
  `;
  layerList.appendChild(row);

  fetch("./geojson/" + cfg.file)
    .then(r => {
      if(!r.ok) throw new Error(cfg.file + " not found");
      return r.json();
    })
    .then(data => {
      const layer = L.geoJSON(data, {
        style: function(){
          return {
            color: cfg.color,
            weight: cfg.weight,
            fillColor: cfg.fill,
            fillOpacity: cfg.opacity,
            opacity: 1
          };
        },

        pointToLayer: function(feature, latlng){
          return L.circleMarker(latlng,{
            radius:8,
            color:cfg.color,
            weight:2,
            fillColor:cfg.fill,
            fillOpacity:0.95
          });
        },

        onEachFeature: function(feature, lyr){
          const props = feature.properties || {};
          let html = `<b>${cfg.name}</b><hr>`;
          Object.keys(props).forEach(k=>{
            if(props[k] !== null && props[k] !== ""){
              html += `<b>${k}</b>: ${props[k]}<br>`;
            }
          });
          lyr.bindPopup(html);
        }
      });

      loadedLayers[id] = layer;

      if(cfg.checked){
        layer.addTo(map);
      }

      boundsGroup.addLayer(layer);

      document.getElementById(id).addEventListener("change", function(){
        if(this.checked){
          map.addLayer(layer);
          bringImportantLayersToFront();
        }else{
          map.removeLayer(layer);
        }
      });

      if(Object.keys(loadedLayers).length === layersConfig.length){
        map.fitBounds(boundsGroup.getBounds(), {padding:[30,30]});
        bringImportantLayersToFront();
      }
    })
    .catch(err=>{
      console.warn("Layer load error:", err.message);
    });
});

function bringImportantLayersToFront(){
  layersConfig.forEach((cfg, i)=>{
    const layer = loadedLayers["layer_" + i];
    if(!layer || !map.hasLayer(layer)) return;

    if(
      cfg.name === "Master Plan Boundary" ||
      cfg.name === "Commercial Line" ||
      cfg.name === "Religious" ||
      cfg.name === "Health" ||
      cfg.name === "Educational" ||
      cfg.name === "Roads"
    ){
      layer.bringToFront();
    }
  });
}

map.on("mousemove", e=>{
  document.getElementById("coords").innerHTML =
    "Lat: " + e.latlng.lat.toFixed(6) + " | Lon: " + e.latlng.lng.toFixed(6);
});

map.on("click", e=>{
  L.popup()
    .setLatLng(e.latlng)
    .setContent(
      "<b>Coordinates</b><br>" +
      "Lat: " + e.latlng.lat.toFixed(6) + "<br>" +
      "Lon: " + e.latlng.lng.toFixed(6)
    )
    .openOn(map);
});

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const drawControl = new L.Control.Draw({
  position:'topleft',
  edit:{featureGroup:drawnItems},
  draw:{
    polygon:true,
    polyline:true,
    rectangle:true,
    circle:false,
    circlemarker:false,
    marker:true
  }
});
map.addControl(drawControl);

map.on(L.Draw.Event.CREATED, function(e){
  drawnItems.addLayer(e.layer);
});

L.control.scale({position:'bottomleft'}).addTo(map);
</script>

</body>
</html>
