<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anah Master Plan Web GIS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
}
#map{width:100%;height:100%;}

.panel{
  position:absolute;
  top:14px;
  right:14px;
  z-index:1000;
  width:285px;
  max-height:88vh;
  overflow:auto;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);
  padding:14px;
}
.panel h2{
  margin:0 0 4px;
  font-size:18px;
  color:#0f172a;
}
.panel small{color:#64748b;}

.layer{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  font-size:14px;
  white-space:nowrap;
}
.swatch{
  width:16px;
  height:16px;
  border-radius:4px;
  border:1px solid #555;
  flex:0 0 16px;
}
.coords{
  position:absolute;
  bottom:12px;
  left:12px;
  z-index:1000;
  background:rgba(15,23,42,.86);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
}
.title{
  position:absolute;
  top:14px;
  left:55px;
  z-index:1000;
  background:rgba(15,23,42,.82);
  color:#fff;
  padding:10px 16px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.title b{font-size:17px;}
.title span{display:block;font-size:12px;color:#cbd5e1;}

@media(max-width:700px){

  .title{
    left:50%;
    transform:translateX(-50%);
    top:12px;
    max-width:230px;
    padding:7px 12px;
    border-radius:12px;
    text-align:center;
  }

  .title b{
    font-size:14px;
  }

  .title span{
    font-size:10px;
  }

  .panel{
    width:calc(100% - 16px);
    left:8px;
    right:8px;
    top:auto;
    bottom:8px;
    max-height:18vh;
    padding:6px 8px;
    border-radius:14px;
    overflow:auto;
    background:rgba(255,255,255,.94);
  }

  .panel h2{
    font-size:11px;
    margin:0;
    line-height:1.1;
  }

  .panel small{
    display:none;
  }

  #layerList{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:2px 6px;
  margin-top:4px;
}

  .layer{
    margin:0;
    gap:4px;
    font-size:10px;
    line-height:1.15;
    white-space:nowrap;
  }

  .layer input{
    width:11px;
    height:11px;
    margin:0;
  }

  .swatch{
    width:9px;
    height:9px;
    flex:0 0 9px;
    border-radius:2px;
  }

  .coords{
    bottom:132px;
    left:10px;
    font-size:10px;
    padding:5px 7px;
    border-radius:8px;
  }

  .leaflet-control-layers{
    margin-bottom:132px !important;
  }

  .leaflet-bottom.leaflet-right{
    bottom:130px !important;
  }

  .leaflet-bottom.leaflet-left{
    bottom:130px !important;
  }

  .leaflet-top.leaflet-right{
   top:10px !important;
   right:10px !important;
  }

  .leaflet-control-layers{
   margin:0 !important;
  }

  .leaflet-control-layers-toggle{
  width:34px !important;
  height:34px !important;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="title">
  <b>Anah Master Plan</b>
  <span>Urban Land Use Web GIS</span>
</div>

<div class="panel">
  <h2>Layers Control</h2>
  <small>Turn layers on / off</small>
  <div id="layerList"></div>
</div>

<div class="coords" id="coords">Lat: -- | Lon: --</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
const map = L.map('map', {
  zoomControl:true,
  maxZoom:22
}).setView([34.369, 41.981], 13);

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:22,
  attribution:'© OpenStreetMap'
});

const esriImagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    maxZoom:22,
    maxNativeZoom:18,
    attribution:'Tiles © Esri'
  }
);

const esriHybrid = L.layerGroup([
  esriImagery,
  L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:22}
  )
]).addTo(map);

L.control.layers({
  "Satellite": esriHybrid,
  "Imagery": esriImagery,
  "OpenStreetMap": osm
}, null, {position:'bottomright'}).addTo(map);

const layersConfig = [

  {
    name:"Master Plan Boundary",
    file:"master plan boundary.geojson",
    color:"#ff3b3b",
    fill:"#ffffff",
    opacity:0.02,
    weight:3,
    checked:true
  },

  {
    name:"Residential",
    file:"Residential.geojson",
    color:"#9a9a00",
    fill:"#ffff00",
    opacity:0.72,
    weight:0.7,
    checked:true
  },

  {
    name:"Proposed Residential",
    file:"Proposed_Residential.geojson",
    color:"#d99000",
    fill:"#ffd27a",
    opacity:0.72,
    weight:1,
    checked:true
  },

  {
    name:"Vertical Residential",
    file:"Vertical_Residential.geojson",
    color:"#5e0000",
    fill:"#8b0000",
    opacity:0.82,
    weight:1,
    checked:true
  },

  {
    name:"Commercial",
    file:"Commercial.geojson",
    color:"#b10000",
    fill:"#ff0000",
    opacity:0.82,
    weight:1,
    checked:true
  },

  {
    name:"Industrial",
    file:"Industrial.geojson",
    color:"#6f00b5",
    fill:"#a000ff",
    opacity:0.78,
    weight:1,
    checked:true
  },

  {
    name:"Public Use",
    file:"PublicUse.geojson",
    color:"#6b8ea3",
    fill:"#c7ddeb",
    opacity:0.82,
    weight:1,
    checked:true
  },

  {
    name:"Educational",
    file:"Educational.geojson",
    color:"#003d99",
    fill:"#0057c2",
    opacity:0.85,
    weight:1,
    checked:true
  },

  {
    name:"Health",
    file:"Health.geojson",
    color:"#b86ca1",
    fill:"#e5acd1",
    opacity:0.88,
    weight:1,
    checked:true
  },

  {
    name:"Green Areas",
    file:"GreenArea.geojson",
    color:"#238f00",
    fill:"#38b000",
    opacity:0.72,
    weight:1,
    checked:true
  },

  {
    name:"Religious",
    file:"Religious.geojson",
    color:"#c69a2d",
    fill:"#f2c96d",
    opacity:0.90,
    weight:1.5,
    checked:true
  },

  {
    name:"Tourist",
    file:"Tourist.geojson",
    color:"#8c6500",
    fill:"#b8860b",
    opacity:0.82,
    weight:1,
    checked:true
  },

  {
    name:"Oil Station",
    file:"Oil station.geojson",
    color:"#0077a8",
    fill:"#00a8e8",
    opacity:0.90,
    weight:1,
    checked:true
  },

  {
    name:"Cemetery",
    file:"cemetery.geojson",
    color:"#b89952",
    fill:"#f0c96b",
    opacity:0.80,
    weight:1,
    checked:true
  },

  {
    name:"Roads",
    file:"Roads.geojson",
    color:"#555555",
    fill:"#8a8a8a",
    opacity:0.95,
    weight:2.2,
    checked:true
  }

];

const loadedLayers = {};
const layerList = document.getElementById("layerList");
const boundsGroup = L.featureGroup();

layersConfig.forEach((cfg, i)=>{
  const id = "layer_" + i;

  const row = document.createElement("div");
  row.className = "layer";
  row.innerHTML = `
    <input type="checkbox" id="${id}" ${cfg.checked ? "checked" : ""}>
    <span class="swatch" style="background:${cfg.fill};border-color:${cfg.color}"></span>
    <label for="${id}">${cfg.name}</label>
  `;
  layerList.appendChild(row);

  fetch("./geojson/" + cfg.file)
    .then(r => {
      if(!r.ok) throw new Error(cfg.file + " not found");
      return r.json();
    })
    .then(data => {
      const layer = L.geoJSON(data, {
        style: function(){
          return {
            color: cfg.color,
            weight: cfg.weight,
            fillColor: cfg.fill,
            fillOpacity: cfg.opacity,
            opacity: 1
          };
        },

       pointToLayer: function(feature, latlng){
  let r = cfg.name === "Religious" ? 10 : 7;

  return L.circleMarker(latlng,{
    radius:r,
    color:cfg.color,
    weight:2.5,
    fillColor:cfg.fill,
    fillOpacity:1
  });
},

        onEachFeature: function(feature, lyr){
  const props = feature.properties || {};
  let html = `<b>${cfg.name}</b><hr>`;

  Object.keys(props).forEach(k=>{
    let val = props[k];

    if(val !== null && val !== ""){
      const key = k.toLowerCase();

     if(
  key.includes("shape_area") ||
  key.includes("area") ||
  key.includes("مساح")
){
  val = Math.round(Number(val)) + " m²";
}

else if(
  key.includes("shape_leng") ||
  key.includes("length") ||
  key.includes("perimeter") ||
  key.includes("محيط")
){
  val = Math.round(Number(val)) + " m";
}

      html += `<b>${k}</b>: ${val}<br>`;
    }
  });

  lyr.bindPopup(html);
}
      });

      loadedLayers[id] = layer;

      if(cfg.checked){
        layer.addTo(map);
      }

      boundsGroup.addLayer(layer);

      document.getElementById(id).addEventListener("change", function(){
        if(this.checked){
          map.addLayer(layer);
          bringImportantLayersToFront();
        }else{
          map.removeLayer(layer);
        }
      });

      if(Object.keys(loadedLayers).length === layersConfig.length){
        map.fitBounds(boundsGroup.getBounds(), {padding:[30,30]});
        bringImportantLayersToFront();
      }
    })
    .catch(err=>{
      console.warn("Layer load error:", err.message);
    });
});

function bringImportantLayersToFront(){
  layersConfig.forEach((cfg, i)=>{
    const layer = loadedLayers["layer_" + i];
    if(!layer || !map.hasLayer(layer)) return;

    if(
      cfg.name === "Religious" ||
      cfg.name === "Health" ||
      cfg.name === "Educational" ||
      cfg.name === "Commercial" ||
      cfg.name === "Oil Station" ||
      cfg.name === "Roads" ||
      cfg.name === "Master Plan Boundary"
    ){
      layer.bringToFront();
    }
  });
}

map.on("mousemove", e=>{
  document.getElementById("coords").innerHTML =
    "Lat: " + e.latlng.lat.toFixed(6) + " | Lon: " + e.latlng.lng.toFixed(6);
});

map.on("click", e=>{
  L.popup()
    .setLatLng(e.latlng)
    .setContent(
      "<b>Coordinates</b><br>" +
      "Lat: " + e.latlng.lat.toFixed(6) + "<br>" +
      "Lon: " + e.latlng.lng.toFixed(6)
    )
    .openOn(map);
});

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

const drawControl = new L.Control.Draw({
  position:'topleft',
  edit:{featureGroup:drawnItems},
  draw:{
    polygon:true,
    polyline:true,
    rectangle:true,
    circle:false,
    circlemarker:false,
    marker:true
  }
});
map.addControl(drawControl);

map.on(L.Draw.Event.CREATED, function(e){
  drawnItems.addLayer(e.layer);
});

L.control.scale({position:'bottomleft'}).addTo(map);
</script>

</body>
</html>
