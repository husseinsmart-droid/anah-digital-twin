<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Anah Master Plan</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}

#map{
    width:100%;
    height:100%;
}

.layer-panel{
    position:absolute;
    top:15px;
    right:15px;
    z-index:1000;
    background:rgba(255,255,255,.95);
    padding:14px;
    border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.25);
    min-width:220px;
}

.layer-panel h3{
    margin:0 0 10px 0;
    font-size:18px;
}

.layer-item{
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:8px;
}

.coords{
    position:absolute;
    bottom:10px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,.7);
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="layer-panel">
    <h3>Layers</h3>

    <div class="layer-item">
        <input type="checkbox" id="residentialCheck" checked>
        <label>Residential</label>
    </div>
</div>

<div class="coords" id="coords">
    Lat: 0 | Lon: 0
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([34.369, 41.981], 13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 22,
    attribution:'© OpenStreetMap'
}
).addTo(map);

let residentialLayer;

fetch('./geojson/Residential.geojson')
.then(res => res.json())
.then(data => {

    residentialLayer = L.geoJSON(data,{
        style:{
            color:'#e6d400',
            weight:1,
            fillColor:'#fff200',
            fillOpacity:0.7
        }
    }).addTo(map);

    map.fitBounds(residentialLayer.getBounds());

});

document.getElementById('residentialCheck')
.addEventListener('change',function(){

    if(this.checked){
        map.addLayer(residentialLayer);
    }else{
        map.removeLayer(residentialLayer);
    }

});

map.on('mousemove',function(e){

    document.getElementById('coords').innerHTML =
    'Lat: ' + e.latlng.lat.toFixed(6) +
    ' | Lon: ' + e.latlng.lng.toFixed(6);

});

</script>

</body>
</html>
